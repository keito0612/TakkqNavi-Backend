version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle-cache:/root/.gradle
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    command: ./gradlew bootRun --args='--spring.profiles.active=dev' --no-daemon

volumes:
  gradle-cache:
